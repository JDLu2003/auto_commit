[package]
name = "acommit"
version = "0.2.0"
edition = "2021"

[dependencies]
git2 = "0.18"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
dialoguer = "0.11"
tempfile = "3.10"
atty = "0.2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
