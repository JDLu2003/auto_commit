name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -- --check
      - run: cargo check
      - run: cargo clippy -- -D warnings

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: acommit
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: acommit
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: acommit.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: acommit-${{ matrix.target }}
          path: target/release/${{ matrix.binary }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p assets
          for dir in acommit-*/; do
            platform="${dir%/}"
            if [[ "$platform" == *linux* ]]; then
              suffix="linux-x86_64"
            elif [[ "$platform" == *darwin* ]]; then
              suffix="macos-arm64"
            elif [[ "$platform" == *windows* ]]; then
              suffix="windows-x86_64.exe"
            fi
            if [[ "$platform" == *windows* ]]; then
              cp "${dir}"acommit.exe "assets/acommit-${suffix}"
            else
              cp "${dir}"acommit "assets/acommit-${suffix}"
            fi
          done
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            assets/* \
            --title "${{ github.ref_name }}" \
            --notes "See the commit log for changes."
